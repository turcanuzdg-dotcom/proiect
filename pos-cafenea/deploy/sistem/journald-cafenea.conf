# /etc/systemd/journald.conf.d/cafenea.conf — cât păstrează jurnalul de sistem (journald).
# Jurnalul serverului POS conține adresele IP ale celor care se conectează (date personale în
# sensul Legii 195/2024), deci nu se păstrează la nesfârșit: 30 de zile, cel mult 1 GB pe disc.

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=4G
SystemMaxFileSize=100M
MaxRetentionSec=30day

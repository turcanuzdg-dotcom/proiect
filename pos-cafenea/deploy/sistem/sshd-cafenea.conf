# /etc/ssh/sshd_config.d/01-cafenea.conf — SSH doar cu chei, fără parole.
# Numele începe cu 01-: la sshd câștigă prima valoare citită, deci aceste setări au întâietate față
# de cele puse de imaginea furnizorului (de ex. 50-cloud-init.conf cu PasswordAuthentication yes).
# instaleaza.sh îl pune doar dacă pe server există deja cel puțin o cheie publică autorizată.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
# root poate intra doar cu cheie (unele imagini VPS nu au alt utilizator); niciodată cu parolă.
PermitRootLogin prohibit-password
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no

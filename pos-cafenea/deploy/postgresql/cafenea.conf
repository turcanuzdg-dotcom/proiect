# /etc/postgresql/16/main/conf.d/cafenea.conf — setări pentru POS pe un VPS cu 4 GB RAM și 2 vCPU.
# Copiat de instaleaza.sh; postgresql.conf din Ubuntu include automat directorul conf.d.
# shared_buffers și shared_preload_libraries cer repornirea PostgreSQL (instaleaza.sh o face).

# ---- Rețea ----
listen_addresses = 'localhost'
max_connections = 50                  # serverul folosește cel mult ~10–15; restul e rezervă

# ---- Memorie (4 GB: ~1 GB PostgreSQL, ≤1 GB Node, restul cache-ul sistemului) ----
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB                       # sortările din rapoarte rămân în memorie
maintenance_work_mem = 256MB

# ---- Disc SSD/NVMe ----
random_page_cost = 1.1
effective_io_concurrency = 200
max_wal_size = 2GB
wal_compression = zstd

# ---- CPU: 2 vCPU ----
# Un raport greu din panou nu ia ambele nuclee: vânzările de pe tablete au mereu unul liber.
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# ---- Jurnal ----
# Interogările lente (peste 0,5 s) ajung în /var/log/postgresql, ca să se vadă din timp ce
# trebuie optimizat pe măsură ce crește istoricul.
log_min_duration_statement = 500ms
# Fără valorile parametrilor în jurnal: acolo ar ajunge nume, sume și hash-uri.
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on

# ---- Statistici pe interogări (SELECT * FROM pg_stat_statements în baza postgres) ----
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# ---- Ora ----
timezone = 'Europe/Chisinau'
log_timezone = 'Europe/Chisinau'

# ---- Parole ----
password_encryption = scram-sha-256

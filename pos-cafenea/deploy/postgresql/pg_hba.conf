# /etc/postgresql/16/main/pg_hba.conf — cine se poate conecta la PostgreSQL și cum.
# Scris de instaleaza.sh (originalul Ubuntu e păstrat ca pg_hba.conf.original). Prima regulă care
# se potrivește decide; tot ce nu e permis explicit mai jos e refuzat.
#
# Nu există conexiuni prin rețea: PostgreSQL ascultă doar pe localhost, iar regulile „host” de la
# final refuză și conexiunile TCP locale. Totul trece prin socketul Unix din /run/postgresql.

# TYPE  DATABASE     USER                          ADDRESS   METHOD

# Administrare: doar utilizatorul de sistem postgres (sudo -u postgres psql).
local   all          postgres                                peer
local   replication  postgres                                peer

# Serverul POS (utilizatorul de sistem „cafenea”) și copiile de siguranță („cafenea-backup”):
# fără parolă, identificați de nucleu după utilizatorul de sistem; corespondența e în pg_ident.conf.
local   cafenea      cafenea_app,cafenea_citire              peer map=cafenea

# Migrațiile: rolul proprietar, cu parola din /etc/cafenea/server.env (DATABASE_URL_MIGRARI).
local   cafenea      cafenea_migrari                         scram-sha-256

# Restul: refuzat.
local   all          all                                     reject
host    all          all                           all       reject
